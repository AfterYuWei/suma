name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      previous_tag:
        description: Optional tag to start generated release notes from
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ -z "$PREVIOUS_TAG" ]]; then
            while IFS= read -r candidate; do
              if [[ "$candidate" != "$RELEASE_TAG" ]]; then
                PREVIOUS_TAG="$candidate"
                break
              fi
            done < <(git tag --sort=-version:refname --merged "$RELEASE_TAG")
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## 更新内容"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              while IFS=$'\t' read -r commit subject; do
                short="${commit:0:7}"
                printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' "$subject" "$short" "$GITHUB_REPOSITORY" "$commit"
              done < <(git log --format='%H%x09%s' "$PREVIOUS_TAG..$RELEASE_TAG")
              echo
              printf '**完整变更记录**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG"
            else
              while IFS=$'\t' read -r commit subject; do
                short="${commit:0:7}"
                printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' "$subject" "$short" "$GITHUB_REPOSITORY" "$commit"
              done < <(git log --format='%H%x09%s' "$RELEASE_TAG")
            fi
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes_file"
          fi
