# PRE 镜像：main 分支每次推送后构建
# 标签：短 commit（如 abc1234，保留历史）+ pre（滚动标签，覆盖更新）
name: pre-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pre-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写；仓库属主若含大写需转换
      - name: Resolve image reference
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/suma" >> "$GITHUB_OUTPUT"
        id: image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=pre

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published tags" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
